[project]
name = "photos-ai-backend"
version = "0.1.0"
description = "Local photo library ingestion, CLIP search, and event clustering."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiofiles>=24.1",
    "pillow>=10.3",
    "piexif>=1.1.3",
    "numpy>=1.26",
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "faiss-cpu>=1.8",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]
cold = [
    "ultralytics>=8.2",
    "transformers>=4.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
